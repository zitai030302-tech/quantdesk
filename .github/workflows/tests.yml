name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-research.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run offline factor demo
        run: python -m research.alpha_lab --synthetic --output /tmp/alpha-demo
      - name: Check package installation
        run: pip install --no-deps .

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build offline backtest image
        run: docker build -t quantdesk-smoke .
      - name: Run default CSV example
        run: docker run --rm quantdesk-smoke

