[project]
name = "quantdesk"
version = "0.2.0"
description = "Event-driven quantitative strategy research sandbox"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*", "backtest*", "data*", "execution*", "risk*", "strategies*", "research*"]

[tool.setuptools.package-data]
"research.alpha_lab" = ["examples/*.json"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
research = ["numpy>=1.26,<3", "pandas>=2.2,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

