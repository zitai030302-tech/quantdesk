{
  "version": 1,
  "disable_existing_loggers": false,
  "formatters": {
    "standard": {
      "format": "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
    }
  },
  "handlers": {
    "console": {
      "class": "logging.StreamHandler",
      "formatter": "standard",
      "level": "INFO",
      "stream": "ext://sys.stdout"
    }
  },
  "loggers": {
    "app": {
      "handlers": ["console"],
      "level": "INFO",
      "propagate": false
    },
    "data": {
      "handlers": ["console"],
      "level": "INFO",
      "propagate": false
    },
    "execution": {
      "handlers": ["console"],
      "level": "INFO",
      "propagate": false
    },
    "risk": {
      "handlers": ["console"],
      "level": "INFO",
      "propagate": false
    },
    "strategies": {
      "handlers": ["console"],
      "level": "INFO",
      "propagate": false
    }
  },
  "root": {
    "handlers": ["console"],
    "level": "INFO"
  }
}
